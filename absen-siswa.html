<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Datang & Pulang</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <div id="loading" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex flex-col items-center justify-center z-50 hidden text-white">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent mb-4"></div>
        <p class="font-semibold" id="loading-txt">Memproses absensi...</p>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Absensi Harian</h1>
            <p class="text-sm text-gray-500">SMKS RIYADLUL HUDA</p>
        </div>

        <form id="form-absen" class="space-y-4">
            
            <!-- Pilihan Jenis Absen -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Jenis Absen</label>
                <div class="flex gap-3">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="jenis" value="datang" class="peer sr-only" checked>
                        <div class="text-center py-2 rounded-lg border border-gray-300 peer-checked:bg-blue-600 peer-checked:text-white peer-checked:border-blue-600 font-semibold transition shadow-sm">Datang</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="jenis" value="pulang" class="peer sr-only">
                        <div class="text-center py-2 rounded-lg border border-gray-300 peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 font-semibold transition shadow-sm">Pulang</div>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Nomor Induk Siswa (NIS)</label>
                <input type="number" id="nis" required class="mt-1 w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Foto Bukti (Selfie)</label>
                <input type="file" id="kamera" accept="image/*" capture="user" required class="mt-1 w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700">
                <img id="preview" class="hidden mt-3 w-full h-48 object-cover rounded-lg border">
            </div>

            <div class="bg-gray-50 p-3 rounded-lg border flex justify-between items-center">
                <div>
                    <p class="text-xs text-gray-500">Lokasi GPS</p>
                    <p id="status-gps" class="text-sm font-bold text-yellow-600">Menunggu...</p>
                </div>
                <button type="button" onclick="cekLokasi()" class="bg-blue-100 text-blue-700 px-3 py-1 rounded text-xs font-bold shadow-sm">Cek Lokasi</button>
            </div>

            <button type="submit" id="btn-submit" disabled class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold disabled:opacity-50 transition">
                KIRIM ABSENSI
            </button>
        </form>
        <div id="msg" class="hidden mt-4 p-3 rounded-lg text-center font-medium text-sm border"></div>
    </div>

    <script>
        // GANTI DENGAN URL API BARU ANDA
        const API_URL = 'PASTE_URL_WEB_APP_APPS_SCRIPT_DI_SINI'; 
        const SCH_LAT = -7.4716212, SCH_LNG = 107.9350232, MAX_RADIUS = 100;
        
        let usrLat = null, usrLng = null, base64Img = null;

        document.getElementById('kamera').addEventListener('change', function(e) {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image(); img.src = ev.target.result;
                img.onload = function() {
                    const cvs = document.createElement('canvas');
                    const scale = 600 / img.width;
                    cvs.width = 600; cvs.height = img.height * scale;
                    cvs.getContext('2d').drawImage(img, 0, 0, cvs.width, cvs.height);
                    base64Img = cvs.toDataURL('image/jpeg', 0.6);
                    document.getElementById('preview').src = base64Img;
                    document.getElementById('preview').classList.remove('hidden');
                    validasi();
                }
            }; reader.readAsDataURL(file);
        });

        function hitungJarak(lat1, lon1, lat2, lon2) {
            const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180, dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2)**2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2)**2;
            return 6371e3 * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function cekLokasi() {
            const stat = document.getElementById('status-gps'); stat.innerText = "Mencari...";
            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        usrLat = pos.coords.latitude; usrLng = pos.coords.longitude;
                        const jrk = Math.round(hitungJarak(SCH_LAT, SCH_LNG, usrLat, usrLng));
                        if(jrk <= MAX_RADIUS) { stat.innerText = `Sesuai (${jrk}m)`; stat.className="text-sm font-bold text-green-600"; }
                        else { stat.innerText = `Terlalu Jauh (${jrk}m)`; stat.className="text-sm font-bold text-red-600"; alert("Anda berada di luar radius sekolah!"); }
                        validasi();
                    },
                    err => { stat.innerText = "GPS Ditolak!"; stat.className="text-sm font-bold text-red-600"; alert("Mohon izinkan akses GPS!"); },
                    {enableHighAccuracy: true}
                );
            } else alert("Browser tidak mendukung GPS.");
        }

        function validasi() {
            document.getElementById('btn-submit').disabled = !(document.getElementById('nis').value && base64Img && usrLat);
        }
        document.getElementById('nis').addEventListener('input', validasi);

        document.getElementById('form-absen').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('loading').classList.remove('hidden');
            
            const jenisDipilih = document.querySelector('input[name="jenis"]:checked').value;
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'absenMandiri', 
                        data: { 
                            jenis: jenisDipilih,
                            nis: document.getElementById('nis').value, 
                            base64Foto: base64Img, 
                            lat: usrLat, 
                            lng: usrLng 
                        } 
                    })
                });
                const json = await res.json();
                document.getElementById('loading').classList.add('hidden');
                
                const msg = document.getElementById('msg'); msg.classList.remove('hidden');
                if(json.success) {
                    msg.className = "mt-4 p-3 rounded-lg text-center font-bold text-sm bg-green-100 text-green-700 border-green-300 border";
                    msg.innerText = "✅ " + json.message;
                    document.getElementById('form-absen').reset();
                    document.getElementById('preview').classList.add('hidden');
                    document.getElementById('btn-submit').disabled = true;
                    // Reset radio ke Datang
                    document.querySelector('input[value="datang"]').checked = true;
                } else {
                    msg.className = "mt-4 p-3 rounded-lg text-center font-bold text-sm bg-red-100 text-red-700 border-red-300 border";
                    msg.innerText = "❌ " + json.message;
                }
            } catch(err) {
                document.getElementById('loading').classList.add('hidden');
                alert("Koneksi gagal terhubung ke server.");
            }
        });
    </script>
</body>
</html>
